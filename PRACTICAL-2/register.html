<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - Campus Portal</title>
</head>
<body>
  <header class="topbar">
    <div class="brand">STUDENT HUB PORTAL</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="container small-container">
    <section class="form-card">
      <h2>Create Your Account</h2>
      <p>Register as a student or faculty member.</p>
      <form>
        <label>Full Name</label>
        <input type="text" placeholder="Your full name" />

        <label>Email</label>
        <input type="email" placeholder="name@example.com" />

        <label>Role</label>
        <select>
          <option>Student</option>
          <option>Faculty</option>
        </select>

        <label>Password</label>
        <input type="password" placeholder="Create password" />

        <button class="btn" type="submit">Register</button>
      </form>
      <p class="helper-text">Already have an account? <a href="login.html">Login here</a></p>
    </section>
  </main>
</body>
</html>
