<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Campus Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">STUDENT HUB PORTAL</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="profile.html">Profile</a>
    </nav>
  </header>

  <main class="container small-container">
    <section class="form-card">
      <h2>Welcome Back</h2>
      <p>Sign in to view your dashboard and academic updates.</p>
      <form>
        <label>Email</label>
        <input type="email" placeholder="student@example.com" />

        <label>Password</label>
        <input type="password" placeholder="Enter password" />

        <button class="btn" type="submit">Login</button>
      </form>
      <p class="helper-text">New user? <a href="register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
